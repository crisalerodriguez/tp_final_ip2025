{% extends 'header.html' %}
{%  load static %}
{% block content %}

    <body  style="background-image: url('{% static 'img/collage.jpg' %}'); background-size:cover background-position: center;">

        <!-- Pantalla de carga -->
        <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); display: none; justify-content: center; align-items: center; z-index: 9999;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando....</span>
            </div>
        </div>

        <!-- Pagina Original -->
        <div style= "background-color: rgb(255 255 255 / 78%); color:#000000">
            {% if request.user.is_authenticated %}
            <h2 class="text-center">Bienvenido {{ user.username | upper }}!</h2>
            {% else %}
            <h2 class="text-center">Bienvenido!</h2>
            {% endif %}
            <p  class="text-center">
                Mirá las imágenes desde <a id="loading-link" style="color: black" href="{% url 'home' %} ">este link.</a>
            </p>
        </div>
        
    </body>


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let loadingScreen = document.getElementById("loading-screen");
            let loadingLink = document.getElementById("loading-link"); // Capturar el <a>

            // Mostrar el loader al hacer clic en el link
            loadingLink.addEventListener("click", function () {
                if (loadingScreen) {
                    loadingScreen.style.display = "flex";
                }
            });
        });
    </script>
{% endblock %}
