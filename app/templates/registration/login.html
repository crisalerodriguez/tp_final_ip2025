{% extends 'header.html' %} {% block content %}
{% load static %}
<body style="background-image: url('{% static 'img/collage.jpg' %}'); background-size:cover background-position:center;">
    <div class="login-form d-flex justify-content-center align-items-center" style="text-align: center; margin-top: 25vh;">
        <form style="background-color: rgb(252, 252, 252); padding: 25px; border-radius: 10%;" action="" method="POST" style="display: inline-block;">
            {% csrf_token %}
            <h2 class="text-center; padding:5px;">Inicio de sesión</h2>
            <div class="form-group" style="margin-bottom: 5%;">
                <input type="text" name="username" id="username" class="form-control" placeholder="Usuario" required="required">
            </div>
            <div class="form-group" style="margin-bottom: 5%;">
                <input type="password" name="password" id="password" class="form-control" placeholder="Contraseña" required="required">
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </div>
        </form>
    </div>
</body>
{% endblock %}
